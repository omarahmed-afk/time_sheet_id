name: Export yesterday's timesheets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-timesheet-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Export to Google Sheets and CSV
        env:
          DEPUTY_TOKEN: ${{ secrets.DEPUTY_TOKEN }}
          GOOGLE_SPREADSHEET_URL: ${{ secrets.GOOGLE_SPREADSHEET_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "import os; required = ('DEPUTY_TOKEN', 'GOOGLE_SPREADSHEET_URL', 'GOOGLE_SERVICE_ACCOUNT_JSON'); missing = [key for key in required if not os.environ.get(key, '').strip()]; exit('Missing GitHub secrets: ' + ', '.join(missing)) if missing else None"
          python yesterday_timesheet_ids.py
      - name: Save CSV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yesterday-timesheet-ids-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/yesterday_*_timesheet_ids.csv
          if-no-files-found: ignore
          retention-days: 7
